[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "v4-core/=lib/v4-core/",
    "solmate/=lib/v4-core/lib/solmate/",
    "forge-std/=lib/forge-std/src/"
]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64

[fmt]
line_length = 100
